name: Build & Release Multi-Platform Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: Linux
            command: npm run build:linux
          - os: windows-latest
            target: Windows
            command: npm run build:win
          - os: macos-latest
            target: macOS
            command: npm run build:mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Linux: Install system dependencies for native modules
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxrandr-dev \
            libgbm-dev \
            libxkbcommon-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libasound2-dev \
            libx11-xcb-dev \
            rpm \
            fakeroot \
            python3

      # macOS: Install python for node-gyp
      - name: Setup Python (macOS)
        if: runner.os == 'macOS'
        run: brew install python-setuptools || true

      # Windows: Install python for node-gyp
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install --prefer-offline
        env:
          npm_config_build_from_source: true

      - name: Rebuild Native Modules for Electron
        run: npx @electron/rebuild --force
        env:
          npm_config_build_from_source: true

      - name: Build Application Package
        run: ${{ matrix.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (optional - skip if no cert)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Build Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-Windows
          path: |
            dist/*.exe
            dist/nsis-web/*.exe
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Build Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.pkg
          retention-days: 14
          if-no-files-found: warn

      - name: Release to GitHub Releases (Tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
