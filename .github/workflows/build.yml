name: Build & Release Multi-Platform Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  #  LINUX BUILD
  # ─────────────────────────────────────────
  build-linux:
    name: Build ubuntu-latest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libsecret-1-dev rpm fakeroot dpkg \
            build-essential python3 python3-pip \
            libnss3-dev libgtk-3-dev libxss1 libasound2-dev

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force

      - name: Build Linux
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────
  #  WINDOWS BUILD
  # ─────────────────────────────────────────
  build-windows:
    name: Build windows-2022 (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11 (avoid Python 3.14 node-gyp crash)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Upgrade node-gyp to latest
        shell: powershell
        run: npm install -g node-gyp@latest

      - name: Install npm dependencies
        shell: powershell
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules for Electron
        shell: powershell
        run: npx @electron/rebuild --force

      - name: Build Windows
        shell: powershell
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-Windows
          path: |
            dist/**/*.exe
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────
  #  MACOS BUILD
  # ─────────────────────────────────────────
  build-macos:
    name: Build macos-latest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force

      - name: Build macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────
  #  RELEASE (only on git tags)
  # ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            leadwave-Linux/*.AppImage
            leadwave-Linux/*.deb
            leadwave-Windows/**/*.exe
            leadwave-macOS/*.dmg
            leadwave-macOS/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
