name: Build & Release Multi-Platform Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  #  LINUX BUILD
  # ─────────────────────────────────────────
  build-linux:
    name: Build ubuntu-latest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libsecret-1-dev rpm fakeroot dpkg \
            build-essential python3 python3-pip \
            libnss3-dev libgtk-3-dev libxss1 libasound2-dev

      - name: Install npm dependencies
        run: npm ci
        env:
          npm_config_python: python3

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force
        env:
          npm_config_python: python3

      - name: Build Linux
        run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────
  #  WINDOWS BUILD
  # ─────────────────────────────────────────
  build-windows:
    name: Build windows-latest (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout (with symlink support)
        uses: actions/checkout@v4
        with:
          # Enable symlinks on Windows checkout
          fetch-depth: 0

      - name: Enable Windows symlinks
        shell: powershell
        run: |
          # Enable developer mode for symlinks
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force }
          Set-ItemProperty -Path $regPath -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Force
          Write-Host "Symlink support enabled"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSVC Build Environment (for better-sqlite3 / node-gyp)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure node-gyp
        shell: powershell
        run: |
          npm config set msvs_version 2022
          npm config set python python3

      - name: Install npm dependencies
        shell: powershell
        run: npm ci
        env:
          npm_config_msvs_version: '2022'

      - name: Rebuild native modules for Electron
        shell: powershell
        run: npx @electron/rebuild --force
        env:
          npm_config_msvs_version: '2022'

      - name: Build Windows
        shell: powershell
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-Windows
          path: |
            dist/**/*.exe
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────
  #  MACOS BUILD
  # ─────────────────────────────────────────
  build-macos:
    name: Build macos-latest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force

      - name: Build macOS
        run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: leadwave-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────
  #  RELEASE (only on git tags)
  # ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            leadwave-Linux/*.AppImage
            leadwave-Linux/*.deb
            leadwave-Windows/**/*.exe
            leadwave-macOS/*.dmg
            leadwave-macOS/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
